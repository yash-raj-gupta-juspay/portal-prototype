<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juspay Bank Portal — HSBC IN</title>

  <!-- Google Fonts: Inter (400,500,600,700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Below-1024px placeholder (Part 6.8) -->
  <div class="mobile-block">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <h2>Please use a desktop</h2>
    <p style="color:#64748B;max-width:320px">The Juspay Bank Portal is optimised for desktop reconciliation work (1024px and above).</p>
  </div>

  <!-- App shell (persists across Bank + Ops routes) -->
  <div class="app" id="app">
    <!-- Icon rail (Ops Portal only — Part 2.1 panel 1). Hidden on Bank routes,
         where the shell keeps its original topbar + sidebar grid. -->
    <aside class="rail" id="rail" aria-label="Portal switcher"></aside>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation"></aside>

    <!-- Top bar -->
    <header class="topbar" id="topbar"></header>

    <!-- Main content (routed views render here). On Ops routes a search row
         (Part 2.1 panel 3) is mounted above the view. -->
    <main class="main" id="main">
      <div class="ops-searchrow" id="opsSearch"></div>
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-wrap" id="toasts"></div>
  <!-- Overlay mount (modals / side panels) -->
  <div id="overlay-mount"></div>

  <!-- Dependencies (Part 8.2) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App -->
  <script src="data.js"></script>
  <script src="ops-data.js"></script>
  <!-- Platform Configs extension (Phase 3) — must load before app.js.
       configs-formats.js first: it owns the output_format catalogues that
       configs-data.js seeds its bodies from. -->
  <script src="configs-formats.js"></script>
  <script src="configs-data.js"></script>
  <script src="configs-core.js"></script>
  <script src="configs-screens.js"></script>
  <script src="configs-queue.js"></script>
  <!-- Rejects (Ops Portal) — staging + incoming rejects across Visa and
       Mastercard, with IRD as a Mastercard subtype. rejects-data.js needs
       window.OPS for tenants and merchants, so it loads after ops-data.js. -->
  <script src="rejects-data.js"></script>
  <script src="rejects-screen.js"></script>
  <!-- Cross-Tenant Cycle Status grid + Cycle Snapshot (Ops Home refinement).
       cycle-data.js needs window.OPS, so it loads after ops-data.js. -->
  <script src="cycle-data.js"></script>
  <script src="cycle-screen.js"></script>
  <!-- Acquirer Reports (refinement round 2 §C) — acquirer-specific
       files, no network dimension. files-data.js needs window.OPS. -->
  <script src="files-data.js"></script>
  <script src="files-screen.js"></script>
  <!-- Network Files (refinement Part 5) — Outgoing (clearing staged to
       networks) and Incoming (files fetched from networks). Both workflows run
       through a person in an RDP session that this dashboard cannot see; what
       it owns is the file, the S3 path the work starts from, and the record of
       who declared they had begun. netfiles-data.js reads window.OPS for cycle
       identity and window.CYCLES for the holiday calendar, so it loads after
       both; netfiles-screen.js also needs window.FailureHints, which is why
       failure-hints.js moves above it. -->
  <script src="failure-hints.js"></script>
  <script src="netfiles-data.js"></script>
  <script src="netfiles-screen.js"></script>
  <!-- File processing detail (Ops Portal only). proc-files-data.js builds the
       step records and reads window.CYCLES and window.SFILES, so it comes after
       both. file-detail-panel.js is the one panel component; Acquirer Reports
       and the Cycle Snapshot are its entry points. -->
  <script src="proc-files-data.js"></script>
  <script src="file-detail-panel.js"></script>
  <script src="configs-flows.js"></script>
  <script src="app.js"></script>
</body>
</html>
