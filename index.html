<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juspay Bank Portal — HSBC IN</title>

  <!-- Google Fonts: Inter (400,500,600,700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Below-1024px placeholder (Part 6.8) -->
  <div class="mobile-block">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <h2>Please use a desktop</h2>
    <p style="color:#64748B;max-width:320px">The Juspay Bank Portal is optimised for desktop reconciliation work (1024px and above).</p>
  </div>

  <!-- App shell (persists across Bank + Ops routes) -->
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation"></aside>

    <!-- Top bar -->
    <header class="topbar" id="topbar"></header>

    <!-- Main content (routed views render here) -->
    <main class="main" id="main">
      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div class="toast-wrap" id="toasts"></div>
  <!-- Overlay mount (modals / side panels) -->
  <div id="overlay-mount"></div>

  <!-- Dependencies (Part 8.2) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App -->
  <script src="data.js"></script>
  <script src="ops-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
